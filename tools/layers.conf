# ════════════════════════════════════════════════════════════════════
# layers.conf — reglas de dependencia entre capas (fitness function)
# ════════════════════════════════════════════════════════════════════
# Formato:  <glob-de-capa> :: <regex-de-imports-PROHIBIDOS> :: <mensaje>
#
# Las lee `tools/check-layers.sh`, que trabaja sobre el GRAFO DE IMPORTS
# (líneas `import` / `from … import` / `require(` / `#include` reales), NO
# sobre el cuerpo del archivo. Comentarios y strings no cuentan: un detector
# con falsos positivos se descarta, y un agente aprende a evadirlo.
#
# Esto es la versión ejecutable de AGENTS.md §3. Si cambias la regla ahí,
# cámbiala aquí — o la regla es prosa decorativa.
#
# Líneas que empiezan por # se ignoran. Vacías también.

# ── Regla universal: el DOMINIO es puro ─────────────────────────────
# No conoce UI, ni frameworks de red, ni SDKs de backend, ni persistencia.
*/Domain/* :: ^(SwiftUI|UIKit|AppKit|WatchKit)$ :: el dominio no puede importar UI
*/Domain/* :: ^(Supabase|Firebase|FirebaseFirestore|Alamofire|CoreData|SQLite|GRDB|Realm)$ :: el dominio no puede importar infraestructura/persistencia
*/domain/* :: ^(react|react-dom|next|vue|svelte|@angular/.*)$ :: el dominio no puede importar UI
*/domain/* :: ^(axios|node-fetch|@supabase/.*|firebase.*|pg|mysql2|mongoose|prisma)$ :: el dominio no puede importar infraestructura/persistencia

# ── Regla universal: la UI no habla con la infraestructura ──────────
# Debe pasar por un caso de uso / orquestador. <!-- FILL: ajusta a tus rutas. -->
*/UI/* :: ^(Supabase|Firebase|FirebaseFirestore|CoreData|SQLite|GRDB|Realm)$ :: la UI no accede a datos directamente (pasa por un UseCase)
*/ui/* :: ^(@supabase/.*|firebase.*|pg|mysql2|mongoose|prisma)$ :: la UI no accede a datos directamente (pasa por un UseCase)

# <!-- FILL: añade tus propias reglas de capa. Ejemplos que suelen valer la pena:
#   */Data/*        :: ^(SwiftUI|UIKit)$          :: la capa de datos no conoce la UI
#   */Presentation/* :: ^(CoreData|Supabase)$      :: la presentación no toca persistencia
#   */Feature/A/*   :: ^FeatureB$                  :: features hermanas no se importan entre sí
# -->

# ── Reglas propias de iOSAppBaseline (2026-08-26) ────────────────────
# Se AMPLÍA el conf universal, no se reescribe: los globs genéricos de arriba
# los fijan tests del harness (ADOPTION §4.5).
#
# El dominio es PURO: ni UI ni red, incluidos nuestros propios paquetes. Un
# `import CoreNetworking` en Domain significaría que el modelo de negocio sabe
# cómo se transporta — el acoplamiento que los puertos existen para evitar.
*/Domain/* :: ^(CoreNetworking|CoreNetworkingTestSupport|AppFoundation)$ :: el dominio no depende de nuestros paquetes de infraestructura ni de arquitectura/UI
# La UI orquesta y presenta; hablar HTTP es trabajo de Data a través de un puerto.
# (La versión `*/UI/*` de esta regla se BORRÓ el 2026-08-28: tras mover a
# `Features/` no casaba con ningún archivo, y `check-layers-coverage.sh` la marcó
# como huérfana. Se había conservado «como red para código heredado» — una
# racionalización: una regla que no mira nada no es una red, es un gate apagado
# con buena conciencia. Si vuelve a haber `Sources/UI/`, se vuelve a añadir.)

# ── OQ-4 (2026-08-28): la UI de una feature vive en Features/<Nombre>/ ──
# `platforms/ios.md` §Estructura de carpetas manda: View+ViewModel+Logic van en
# `Features/<Nombre>/`, con Domain/, Data/ y App/ como carpetas hermanas. Al mover
# `Sources/UI/Movies` → `Sources/Features/Movies`, el glob `*/UI/*` dejó de casar y
# la regla de arriba se volvió MUDA: un `import CoreNetworking` en la feature pasaba
# con errors=0. Se verificó empíricamente antes de mover. La regla viaja con la
# estructura, o la estructura se lleva por delante el gate sin decirlo.
*/Features/* :: ^(CoreNetworking|CoreNetworkingTestSupport)$ :: la UI no habla HTTP (pasa por un repositorio de Data)
*/Features/* :: ^(Supabase|Firebase|FirebaseFirestore|CoreData|SQLite|GRDB|Realm)$ :: la UI no accede a datos directamente (pasa por un UseCase)
