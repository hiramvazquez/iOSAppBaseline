# ════════════════════════════════════════════════════════════════════
# skill-matrix.conf — FUENTE ÚNICA de la matriz path → lectura obligatoria
# ════════════════════════════════════════════════════════════════════
# La lee skill-reminder.sh en runtime. AGENTS.md §11 es la VISTA HUMANA de
# este archivo: si cambias algo aquí, actualiza la tabla de §11 en el mismo
# commit. La divergencia la caza `tools/check-skill-matrix-doc.sh`, que compara
# el conjunto de refs de los dos lados.
#
# Ojo a la corrección: esta cabecera afirmó durante meses que la cazaba
# `test_skill_matrix.sh`. No era verdad — ese test comprueba que las refs
# EXISTAN y sean registrables, nunca compara tabla contra conf. Una afirmación
# de cobertura sin detector detrás es peor que no tenerla: se lee, se cree, y
# nadie vuelve a mirar. Si escribes "esto lo caza X", abre X y compruébalo.
#
# Formato:   glob_de_bash|ref1,ref2,...
#   - El glob se evalúa contra la ruta RELATIVA al repo con `case` de bash
#     (usa * y ?; NO es glob de shell extendido ni regex).
#   - Las refs son rutas de archivos que el agente debe haber LEÍDO en la
#     sesión antes de poder editar un archivo que case con el glob.
#   - Las exclusiones (docs/, tools/, .agents/, etc. no son código de
#     producto) viven en skill-reminder.sh, no aquí.
#
# <!-- FILL: ajusta los globs a TUS carpetas y stack reales. Los de abajo
#      cubren iOS (referencia rellenada), Android, web y backend genérico. -->

# ── UI / pantallas ──────────────────────────────────────────────────
# Swift añade la skill de plataforma: ahí viven las trampas que no se deducen
# leyendo el código (los `.gitkeep` que colisionan con
# PBXFileSystemSynchronizedRootGroup en Xcode 16+, entre otras). §11 ya lo
# exigía en su tabla; el conf no lo pedía, así que el gate no lo cumplía —
# divergencia real cazada por check-skill-matrix-doc.sh en su primera pasada.
*View*.swift|.agents/skills/architecture/SKILL.md,.agents/skills/architecture/platforms/ios.md
*Screen*.swift|.agents/skills/architecture/SKILL.md,.agents/skills/architecture/platforms/ios.md
*.tsx|.agents/skills/architecture/SKILL.md
*Screen*.kt|.agents/skills/architecture/SKILL.md
*/ui/*|.agents/skills/architecture/SKILL.md
# Las DOS grafias, como ya se hacia con domain/Domain unas lineas mas abajo: el
# match del hook es `case "$rel" in`, que en bash SI distingue mayusculas. Con
# solo la minuscula, un `Sources/UI/Movies/MoviesRoute.swift` no exigia ninguna
# lectura —solo casaban los *View*.swift y *ViewModel*.swift por su nombre—, y
# el agujero quedaba justo en el modulo de referencia que otros van a copiar.
*/UI/*|.agents/skills/architecture/SKILL.md
# OQ-C (owner, 2026-08-28). Tras mover a `Features/` (OQ-4) el sweep se hizo en
# `layers.conf` y NO aquí, así que `Sources/Features/**` quedó cubierto solo por
# nombre de archivo y `Sources/App/**` por nada: `BaselineApp.swift` —que arma el
# APIService con el header Authorization— se podía editar sin leer una sola skill,
# y `MoviesScreenStore.swift` casaba con `*Screen*.swift` por accidente léxico.
# Una cobertura accidental desaparece el día que alguien renombra el archivo.
*/Features/*|.agents/skills/architecture/SKILL.md,.agents/skills/architecture/platforms/ios.md
# `App/` es composition root: arma el grafo de dependencias y es donde entran las
# credenciales al proceso. Por eso security, no solo architecture.
*/App/*|.agents/skills/architecture/SKILL.md,.agents/skills/architecture/platforms/ios.md,.agents/skills/security/SKILL.md

# ── Lógica / casos de uso (TDD obligatorio antes de tocar lógica) ───
# Swift además exige el estado del arte del lenguaje: evita el "Swift de memoria vieja"
# (GCD, completion handlers, ObservableObject) en código nuevo.
*Logic*.swift|.agents/skills/architecture/SKILL.md,.agents/skills/domain/SKILL.md,.agents/skills/process/references/tdd-workflow.md,.agents/skills/architecture/platforms/swift-estado-del-arte.md
*ViewModel*.swift|.agents/skills/architecture/SKILL.md,.agents/skills/domain/SKILL.md,.agents/skills/process/references/tdd-workflow.md,.agents/skills/architecture/platforms/swift-estado-del-arte.md
*UseCase*.swift|.agents/skills/architecture/SKILL.md,.agents/skills/domain/SKILL.md,.agents/skills/process/references/tdd-workflow.md,.agents/skills/architecture/platforms/swift-estado-del-arte.md
*UseCase*.kt|.agents/skills/architecture/SKILL.md,.agents/skills/domain/SKILL.md,.agents/skills/process/references/tdd-workflow.md
*/services/*.ts|.agents/skills/architecture/SKILL.md,.agents/skills/domain/SKILL.md,.agents/skills/process/references/tdd-workflow.md
*/domain/*|.agents/skills/domain/SKILL.md,.agents/skills/process/references/tdd-workflow.md
*/Domain/*|.agents/skills/domain/SKILL.md,.agents/skills/process/references/tdd-workflow.md
# Backend genérico (Python/Go): la promesa es "any project type", y un glob
# ausente aquí = gate MUDO para ese stack (lo vigila session-start).
*/usecases/*.py|.agents/skills/domain/SKILL.md,.agents/skills/process/references/tdd-workflow.md
*/services/*.py|.agents/skills/domain/SKILL.md,.agents/skills/process/references/tdd-workflow.md
*_service.go|.agents/skills/domain/SKILL.md,.agents/skills/process/references/tdd-workflow.md
*_usecase.go|.agents/skills/domain/SKILL.md,.agents/skills/process/references/tdd-workflow.md

# ── Datos / migraciones ─────────────────────────────────────────────
*/Data/*|.agents/skills/domain/SKILL.md,.agents/skills/security/SKILL.md
*/migrations/*|.agents/skills/domain/SKILL.md,.agents/skills/security/SKILL.md

# ── PRDs ────────────────────────────────────────────────────────────
docs/process/prds/[0-9]*.md|.agents/skills/process/references/prd-lifecycle.md,.agents/skills/process/references/feature-workflow.md
