# ════════════════════════════════════════════════════════════════════
# verify.conf — EL comando que compila y prueba este proyecto
# ════════════════════════════════════════════════════════════════════
# Una sola línea, y es la fuente única. La usan tres sitios:
#   · `tools/verify-run.sh`  (local: corre y deja EVIDENCIA firmada del diff)
#   · `ci/run-gates.sh` paso 6 (CI: corre y bloquea)
#   · `session-start` / `validate-harness` (para reportar si sigue sin cablear)
#
# Antes el comando vivía como un FILL dentro de `ci/run-gates.sh`, o sea: solo
# en CI y solo como plantilla. En local NADA ataba un build verde al cambio que
# se commiteaba. El marker de review se liga a `sha256(diff staged)` y ninguna
# ejecución de tests se ligaba a ese mismo diff — se podía commitear un árbol
# que ninguna ejecución registrada llegó a compilar. El invariante nº1 estaba
# aplicado al reviewer y no a los tests.
#
# Escribe UN comando (encadena con && lo que haga falta). Debe salir 0 si y
# solo si el proyecto compila Y sus tests pasan. Sin rodeos: si tu comando
# devuelve 0 con tests rojos, todo lo de arriba se vuelve decorado.
#
# Ejemplos reales:
#   xcodebuild -scheme MiApp -destination 'platform=iOS Simulator,name=iPhone 16' -quiet -test-timeouts-enabled YES test
#   ./gradlew --quiet testDebugUnitTest
#   npm ci --silent && npm test --silent
#   pytest -q && mypy --strict .
#
# `-test-timeouts-enabled YES` porque un test que se CUELGA es peor que uno que
# falla: sin timeout, el runner espera hasta que el job de CI muera por su
# propio limite, y el log no dice cual se colgo — el gate no queda rojo, queda
# mudo. (Leccion [2026-08-09] del harness.)
#
# CABLEADO 2026-08-26 para iOSAppBaseline (iOS 17 / Swift 6). El destino se puede
# sobrescribir con GATES_IOS_DESTINATION para correr en otro simulador o en CI.
# El `xcodegen generate` va DELANTE a propósito: el .xcodeproj es un artefacto
# gitignored, así que en un clon recién hecho no existe y el build fallaría con
# un error que no dice "te falta generar el proyecto".
#
# El bloque de abajo es el texto original del template, conservado como
# referencia de por qué existe este archivo:
# <!-- FILL-HECHO: el comando de build+tests de tu stack.
#      Lo que hay ahí es el autochequeo del TEMPLATE (su producto es el propio
#      harness, así que sus "tests" son la suite de gates). En tu proyecto ese
#      comando no compila nada tuyo: `verify-run.sh` lo detecta —ve que hay
#      código de producto en el repo y que el comando no lo toca— y sale con 3
#      ("no pude verificar"), que avisa en local y BLOQUEA en CI. No hace falta
#      que te acuerdes; hace falta que lo sustituyas. -->
xcodegen generate && xcodebuild test -project iOSAppBaseline.xcodeproj -scheme iOSAppBaseline -destination "${GATES_IOS_DESTINATION:-platform=iOS Simulator,name=iPhone 17}" -quiet -test-timeouts-enabled YES
