name: iOSAppBaseline
options:
  bundleIdPrefix: com.hiram
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # El .xcodeproj es un ARTEFACTO generado desde este archivo: no se commitea
  # (ver .gitignore). La fuente de verdad del proyecto es este YAML, legible y
  # sin conflictos de merge — la razón por la que existe xcodegen aquí.
  generateEmptyDirectories: true

# Los dos paquetes propios, por RUTA LOCAL mientras se estabiliza su API.
# Al publicarlos (tag 1.0.0) esto pasa a `url:` + `from:` y es la ÚNICA línea
# que cambia — la ventaja concreta de declarar el proyecto en YAML.
packages:
  AppFoundation:
    path: ../spm-pro/AppFoundation
  CoreNetworking:
    path: ../spm-pro/CoreNetworking

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

targets:
  iOSAppBaseline:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: AppFoundation
        product: AppFoundation
      - package: CoreNetworking
        product: CoreNetworking
    settings:
      base:
        INFOPLIST_FILE: Config/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.hiram.iOSAppBaseline
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        # Nivel 0 de la pirámide de verificación: el compilador es el primer
        # reviewer y el único que no se cansa.
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  iOSAppBaselineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/UnitTests
    dependencies:
      - target: iOSAppBaseline
      - package: CoreNetworking
        product: CoreNetworkingTestSupport
    settings:
      base:
        # El bundle de tests no lleva Info.plist propio en el repo: Xcode lo
        # genera. Uno a mano solo sería otro archivo que mantener sincronizado.
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

schemes:
  iOSAppBaseline:
    build:
      targets:
        iOSAppBaseline: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - iOSAppBaseline
      targets:
        - iOSAppBaselineTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
